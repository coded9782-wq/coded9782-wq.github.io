<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Minty app icon</title>
  <!-- Master launcher artwork: original Minty mascot (happy) on mint. Full-bleed square; platform masks apply the shape.
       Keep the mascot inside the central ~66% safe zone for Android adaptive icons. -->
  <defs>
    <radialGradient id="bg" cx="0.35" cy="0.28" r="0.95">
      <stop offset="0" stop-color="#E9FBF1"/>
      <stop offset="0.55" stop-color="#BDEDD3"/>
      <stop offset="1" stop-color="#86D6AE"/>
    </radialGradient>
    <radialGradient id="body" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#EAFBF2"/>
      <stop offset="0.45" stop-color="#ABE7C6"/>
      <stop offset="1" stop-color="#6CC99A"/>
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF4"/>
      <stop offset="1" stop-color="#E3F3DF"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4DB06C"/>
      <stop offset="1" stop-color="#A6E58F"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="34" y="64" width="132" height="122" rx="58"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2F8A60" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="820" cy="210" r="120" fill="#FFFFFF" opacity="0.25"/>
  <circle cx="190" cy="860" r="90" fill="#FFFFFF" opacity="0.18"/>

  <!-- Mascot in 200x200 space, scaled 3.6x and centered. -->
  <g transform="translate(152 140) scale(3.6)">
    <ellipse cx="100" cy="192" rx="50" ry="6" fill="#2F8A60" opacity="0.2"/>
    <g filter="url(#soft)">
      <ellipse cx="38" cy="152" rx="11" ry="15" transform="rotate(22 38 152)" fill="url(#body)" stroke="#2F8A60" stroke-opacity="0.35" stroke-width="1.5"/>
      <ellipse cx="162" cy="152" rx="11" ry="15" transform="rotate(-22 162 152)" fill="url(#body)" stroke="#2F8A60" stroke-opacity="0.35" stroke-width="1.5"/>
      <path d="M100 68C100 58 101 49 104 42" fill="none" stroke="#2F8A60" stroke-width="4" stroke-linecap="round"/>
      <path d="M103 52C111 36 131 32 143 38C137 53 119 61 103 52Z" fill="url(#leaf)" stroke="#2F8A60" stroke-opacity="0.5" stroke-width="1.2"/>
      <path d="M107 50Q123 44 136 40" fill="none" stroke="#E6FAD9" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
      <path d="M101 58C93 48 80 47 73 51C79 61 92 63 101 58Z" fill="url(#leaf)" stroke="#2F8A60" stroke-opacity="0.5" stroke-width="1.2"/>
      <rect x="34" y="64" width="132" height="122" rx="58" fill="url(#body)"/>
    </g>
    <g clip-path="url(#clip)">
      <path d="M20 162Q100 174 180 162V200H20Z" fill="url(#base)"/>
      <path d="M20 162Q100 174 180 162" fill="none" stroke="#2F8A60" stroke-opacity="0.25" stroke-width="1.5"/>
      <ellipse cx="100" cy="196" rx="70" ry="18" fill="#2F8A60" opacity="0.1"/>
    </g>
    <rect x="34" y="64" width="132" height="122" rx="58" fill="none" stroke="#2F8A60" stroke-opacity="0.4" stroke-width="1.8"/>
    <ellipse cx="70" cy="88" rx="20" ry="10" transform="rotate(-24 70 88)" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="94" cy="78" r="3.6" fill="#FFFFFF" opacity="0.55"/>
    <ellipse cx="62" cy="139" rx="10.5" ry="6.5" fill="#FF98B0" opacity="0.6"/>
    <ellipse cx="138" cy="139" rx="10.5" ry="6.5" fill="#FF98B0" opacity="0.6"/>
    <ellipse cx="78" cy="122" rx="7" ry="9" fill="#1F3D2C"/>
    <circle cx="80.4" cy="118.4" r="2.6" fill="#FFFFFF"/>
    <circle cx="75.4" cy="125.6" r="1.1" fill="#FFFFFF" opacity="0.7"/>
    <ellipse cx="122" cy="122" rx="7" ry="9" fill="#1F3D2C"/>
    <circle cx="124.4" cy="118.4" r="2.6" fill="#FFFFFF"/>
    <circle cx="119.4" cy="125.6" r="1.1" fill="#FFFFFF" opacity="0.7"/>
    <path d="M89 139Q100 150 111 139" fill="none" stroke="#1F3D2C" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
